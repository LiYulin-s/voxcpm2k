name: Publish

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Install host development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
      - name: Build JVM runtime resources
        run: >-
          ./gradlew prepareJvmNativeResources
          --configuration-cache
          -Pvoxcpm2.xmake.toolchain=clang
      - uses: actions/upload-artifact@v4
        with:
          name: jvm-native-runtime
          path: build/generated/resources/jvmMain/native/linux-x86_64
          if-no-files-found: error
      - name: Publish Linux KMP target and native sidecar
        run: >-
          ./gradlew
          publishToMavenCentral
          publishLinuxX64PublicationToMavenCentralRepository
          publishLinuxX64RuntimePublicationToMavenCentralRepository
          -x publishAndroidPublicationToMavenCentralRepository
          -x publishJvmPublicationToMavenCentralRepository
          -x publishKotlinMultiplatformPublicationToMavenCentralRepository
          -x publishIosRuntimePublicationToMavenCentralRepository
          --no-configuration-cache
          -Pvoxcpm2.xmake.toolchain=clang

  publish-apple-android:
    needs: publish-linux
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "ndk;29.0.14206865"
          yes | sdkmanager --licenses >/dev/null || true
      - uses: actions/download-artifact@v4
        with:
          name: jvm-native-runtime
          path: build/generated/resources/jvmMain/native/linux-x86_64
      - name: Publish KMP metadata, JVM, Android, Apple, and iOS sidecar
        run: >-
          ./gradlew
          publishToMavenCentral
          -x publishLinuxX64PublicationToMavenCentralRepository
          -x publishLinuxX64RuntimePublicationToMavenCentralRepository
          --no-configuration-cache
      - name: Publish consumer plugin to Gradle Plugin Portal
        run: ./gradlew :gradle-plugin:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
