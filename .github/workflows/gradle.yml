name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Install host development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools libvulkan-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
      - name: Test native runtime
        working-directory: native/voxcpm2-ncnn
        run: |
          xmake f -c -y -m release --profile=true --toolchain=clang
          xmake test -j 1
      - name: Test JVM, Linux K/N, and consumer plugin
        run: |
          ./gradlew \
            jvmTest jvmJar linuxX64Test linuxX64RuntimeZip \
            :gradle-plugin:test :gradle-plugin:validatePlugins \
            :example:desktopJar \
            --configuration-cache \
            -Pvoxcpm2.xmake.toolchain=clang
          ./gradlew \
            jvmTest jvmJar linuxX64Test linuxX64RuntimeZip \
            :gradle-plugin:test :gradle-plugin:validatePlugins \
            :example:desktopJar \
            --configuration-cache \
            -Pvoxcpm2.xmake.toolchain=clang
      - name: Inspect Linux runtime artifacts
        run: |
          jvm_jar=$(find build/libs -name '*-jvm-*.jar' -print -quit)
          test -n "$jvm_jar"
          unzip -Z1 "$jvm_jar" | grep -qx 'native/linux-x86_64/libvoxcpm2_ncnn.so'
          unzip -Z1 "$jvm_jar" | grep -qx 'native/linux-x86_64/libvoxcpm2_jni.so'
          unzip -Z1 "$jvm_jar" | grep -qx 'native/linux-x86_64/libomp.so'
          sidecar=build/distributions/voxcpm2-native-linuxx64-0.1.0.zip
          unzip -Z1 "$sidecar" | grep -qx 'lib/libvoxcpm2_ncnn.so'
          unzip -Z1 "$sidecar" | grep -qx 'lib/libomp.so'
          unzip -Z1 "$sidecar" | grep -qx 'include/voxcpm2/c_api.h'
          test -z "$(unzip -Z1 "$sidecar" | grep 'voxcpm2_jni' || true)"
          readelf -d build/xmake/linuxX64/linux/x86_64/release/shared/libvoxcpm2_ncnn.so | grep -Fq '$ORIGIN'
          readelf -d build/xmake/linuxX64/linux/x86_64/release/shared/libvoxcpm2_jni.so | grep -Fq '$ORIGIN'
          nm -D build/xmake/linuxX64/linux/x86_64/release/shared/libvoxcpm2_jni.so | grep -q 'JNI_OnLoad'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "ndk;29.0.14206865"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Build Android binding and example app
        run: |
          ./gradlew assembleAndroidMain testAndroidHostTest :example-app:assembleDebug --configuration-cache
          ./gradlew assembleAndroidMain testAndroidHostTest :example-app:assembleDebug --configuration-cache
      - name: Inspect Android AAR and example APK
        run: |
          aar=$(find build/outputs -name '*.aar' -print -quit)
          test -n "$aar"
          for library in libvoxcpm2_ncnn.so libvoxcpm2_jni.so libc++_shared.so; do
            unzip -Z1 "$aar" | grep -qx "jni/arm64-v8a/$library"
          done
          test "$(unzip -Z1 "$aar" | grep -c '^jni/arm64-v8a/.*\.so$')" -eq 3
          apk=$(find example-app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$apk"
          for library in libvoxcpm2_ncnn.so libvoxcpm2_jni.so libc++_shared.so; do
            unzip -Z1 "$apk" | grep -qx "lib/arm64-v8a/$library"
          done

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Test iOS simulator and package shared sidecar
        run: |
          ./gradlew iosSimulatorArm64Test iosRuntimeZip --configuration-cache
          ./gradlew iosSimulatorArm64Test iosRuntimeZip --configuration-cache
      - name: Inspect iOS XCFramework
        run: |
          sidecar=build/distributions/voxcpm2-native-ios-0.1.0.zip
          unzip -Z1 "$sidecar" | grep -qx 'VoxCPM2Native.xcframework/ios-arm64/libvoxcpm2_ncnn.dylib'
          unzip -Z1 "$sidecar" | grep -qx 'VoxCPM2Native.xcframework/ios-arm64-simulator/libvoxcpm2_ncnn.dylib'
          otool -L build/xcframework/VoxCPM2Native.xcframework/ios-arm64/libvoxcpm2_ncnn.dylib
          otool -L build/xcframework/VoxCPM2Native.xcframework/ios-arm64-simulator/libvoxcpm2_ncnn.dylib
